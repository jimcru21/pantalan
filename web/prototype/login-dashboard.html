<!doctype html>
<!--
  PROTOTYPE — throwaway. Answers wayfinder ticket "Login and Dashboard look" (#7).
  Three login variants and three Dashboard variants on one page, switchable via
  ?screen=login|dash&login=A|B|C&dash=A|B|C&theme=light|dark and the floating bar
  (← / → cycle the variant for the current screen).

  Lives outside web/dist on purpose, so it is never embedded in the binary.
  Plain HTML + CSS + a little vanilla JS: the CSS tokens and markup port straight
  into html/template + htmx (the chosen stack). All data is mock.

  Login demo states: any username/password signs in;
  password "wrong" shows the bad-credentials error, "locked" shows the throttle error.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROTOTYPE · Pantalan login + Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #ffffff; --surface-2: #f0f2f5; --border: #e2e5ea;
    --text: #171a1f; --muted: #636b78; --accent: #2f6fed; --accent-text: #ffffff;
    --accent-soft: #e6eefd; --ok: #1a8a4a; --ok-soft: #e3f4ea; --warn: #b26a00; --warn-soft: #fdf1dc;
    --danger: #c2333a; --danger-soft: #fbe6e7; --rail: #11151b; --rail-text: #aab2bf; --rail-active: #ffffff;
    --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --radius: 8px; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 1px 3px rgba(16,24,40,.08);
    color-scheme: light;
  }
  :root[data-theme="dark"] {
    --bg: #0d1015; --surface: #151a21; --surface-2: #1c222b; --border: #2a313c;
    --text: #e6e9ee; --muted: #8b94a3; --accent: #5b8ff9; --accent-text: #0b1020;
    --accent-soft: #1b2a47; --ok: #3ccf7a; --ok-soft: #133222; --warn: #f0a93b; --warn-soft: #3a2a10;
    --danger: #f06a70; --danger-soft: #3c1a1d; --rail: #0a0d11; --rail-text: #7d8796; --rail-active: #ffffff;
    --shadow: 0 1px 2px rgba(0,0,0,.4);
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  #app > * { min-height: 100vh; }
  body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--sans); }
  button, input { font: inherit; color: inherit; }
  a { color: var(--accent); }
  .mono { font-family: var(--mono); font-size: .92em; }
  .muted { color: var(--muted); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
  .dot.off { background: var(--muted); } .dot.warn { background: var(--warn); }
  .badge { display: inline-flex; align-items: center; gap: 6px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; }
  .badge.running { background: var(--ok-soft); color: var(--ok); }
  .badge.exited { background: var(--surface-2); color: var(--muted); }
  .badge.restarting { background: var(--warn-soft); color: var(--warn); }
  .bar { height: 6px; background: var(--surface-2); border-radius: 999px; overflow: hidden; }
  .bar > i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
  .bar.hot > i { background: var(--warn); }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-weight: 500; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .04em; }
  tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .scroll-x { overflow-x: auto; }
  .field { display: grid; gap: 6px; }
  .field label { font-weight: 500; font-size: 13px; }
  .input { width: 100%; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface); outline: none; }
  .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .btn { display: inline-flex; justify-content: center; align-items: center; gap: 8px; padding: 9px 14px; border-radius: 6px; border: 1px solid transparent; background: var(--accent); color: var(--accent-text); font-weight: 600; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--text); border-color: var(--border); font-weight: 500; }
  .alert { padding: 10px 12px; border-radius: 6px; background: var(--danger-soft); color: var(--danger); font-size: 13px; }
  .icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }

  /* ---------- Login A: centred card ---------- */
  .la { min-height: 100%; display: grid; place-items: center; padding: 24px 16px 96px; }
  .la-card { width: 100%; max-width: 380px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); padding: 28px; display: grid; gap: 18px; }
  .la-brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 18px; }
  .la-foot { font-size: 12px; color: var(--muted); border-top: 1px solid var(--border); padding-top: 14px; display: grid; gap: 4px; }

  /* ---------- Login B: split screen with Node facts ---------- */
  .lb { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); }
  .lb-side { background: var(--rail); color: #dfe4ea; padding: 48px; display: flex; flex-direction: column; justify-content: space-between; gap: 32px; }
  .lb-side h2 { font-size: 28px; line-height: 1.2; margin: 0 0 8px; color: #fff; }
  .lb-facts { display: grid; grid-template-columns: auto 1fr; gap: 8px 20px; font-size: 13px; }
  .lb-facts dt { color: #8792a2; } .lb-facts dd { margin: 0; font-family: var(--mono); color: #fff; word-break: break-all; }
  .lb-main { display: grid; place-items: center; padding: 32px 16px 96px; }
  .lb-form { width: 100%; max-width: 340px; display: grid; gap: 18px; }
  .lb-form h1 { margin: 0; font-size: 22px; }
  @media (max-width: 760px) { .lb { grid-template-columns: 1fr; } .lb-side { padding: 28px 16px; } }

  /* ---------- Login C: terminal-minimal ---------- */
  .lc { min-height: 100%; font-family: var(--mono); padding: 12vh 16px 96px; display: flex; justify-content: center; }
  .lc-wrap { width: 100%; max-width: 560px; display: grid; gap: 22px; }
  .lc-head { font-size: 13px; color: var(--muted); }
  .lc-head b { color: var(--text); font-weight: 600; }
  .lc-row { display: grid; grid-template-columns: 110px 1fr; align-items: center; gap: 12px; }
  .lc-row label { color: var(--muted); }
  .lc .input { border: 0; border-bottom: 1px solid var(--border); border-radius: 0; background: transparent; padding: 8px 2px; font-family: var(--mono); }
  .lc .input:focus { box-shadow: none; border-color: var(--accent); }
  .lc .btn { justify-self: start; font-family: var(--mono); border-radius: 4px; }
  .lc-note { font-size: 12px; color: var(--muted); line-height: 1.7; }
  .lc-note code { color: var(--text); }

  /* ---------- Dashboard shared ---------- */
  .page { padding: 24px 24px 88px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; align-content: start; min-width: 0; }
  .page-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .page-head h1 { margin: 0; font-size: 20px; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; }
  .panel-h { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-weight: 600; }
  .panel-b { padding: 16px; }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: 13px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
  .events { list-style: none; margin: 0; padding: 0; font-size: 13px; }
  .events li { display: grid; grid-template-columns: 56px 1fr; gap: 10px; padding: 7px 16px; border-bottom: 1px solid var(--border); }
  .events li:last-child { border-bottom: 0; }

  /* ---------- Dashboard A: icon rail + metric cards ---------- */
  .da { display: grid; grid-template-columns: 56px minmax(0, 1fr); min-height: 100%; }
  .da-rail { background: var(--rail); display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 12px 0; position: sticky; top: 0; height: 100vh; }
  .da-rail .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); color: #fff; display: grid; place-items: center; font-weight: 800; margin-bottom: 12px; }
  .da-rail button { position: relative; width: 40px; height: 40px; border-radius: 8px; border: 0; background: transparent; color: var(--rail-text); display: grid; place-items: center; cursor: pointer; }
  .da-rail button:hover, .da-rail button.on { background: rgba(255,255,255,.08); color: var(--rail-active); }
  .da-rail button[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: 48px; top: 50%; transform: translateY(-50%); background: #000; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; z-index: 5; }
  .da-rail .spacer { flex: 1; }
  .da-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 24px; background: var(--surface); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .da-top .who { display: flex; gap: 10px; align-items: center; font-weight: 600; }
  .da-cards { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .da-card { padding: 16px; display: flex; gap: 14px; align-items: center; }
  .ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; flex: none; display: grid; place-items: center;
          background: conic-gradient(var(--accent) calc(var(--p) * 1%), var(--surface-2) 0); }
  .ring.hot { background: conic-gradient(var(--warn) calc(var(--p) * 1%), var(--surface-2) 0); }
  .ring > span { width: 50px; height: 50px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; }
  .da-card h3 { margin: 0; font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); font-weight: 500; }
  .da-card .big { font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .da-grid { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); gap: 16px; align-items: start; }
  .da-side { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
  @media (max-width: 1100px) { .da-cards { grid-template-columns: repeat(2, minmax(0, 1fr)); } .da-grid { grid-template-columns: 1fr; } }
  @media (max-width: 560px) { .da-cards { grid-template-columns: 1fr; } .page { padding: 16px 16px 88px; } }

  /* ---------- Dashboard B: full labelled sidebar + spec sheet ---------- */
  .db { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
  .db-side { background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; }
  .db-brand { padding: 16px 18px; font-weight: 800; font-size: 16px; display: flex; gap: 10px; align-items: center; }
  .db-brand .logo { width: 26px; height: 26px; border-radius: 6px; background: var(--accent); color: #fff; display: grid; place-items: center; font-size: 13px; }
  .db-node { margin: 0 12px 8px; padding: 10px 12px; border: 1px solid var(--border); border-radius: var(--radius); background: var(--surface-2); font-size: 12px; display: grid; gap: 2px; }
  .db-node b { font-size: 13px; display: flex; gap: 8px; align-items: center; }
  .db-nav { padding: 8px; display: grid; gap: 2px; flex: 1; align-content: start; overflow-y: auto; }
  .db-nav .sec { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); padding: 14px 10px 4px; }
  .db-nav a { display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 6px; color: var(--text); text-decoration: none; }
  .db-nav a:hover { background: var(--surface-2); }
  .db-nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .db-nav a .count { margin-left: auto; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .db-nav a.soon { color: var(--muted); }
  .db-nav a.soon .count { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; }
  .db-user { border-top: 1px solid var(--border); padding: 12px 14px; display: flex; align-items: center; gap: 10px; }
  .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-weight: 700; font-size: 12px; }
  .db-user .btn { margin-left: auto; padding: 5px 8px; }
  .db-crumb { font-size: 12px; color: var(--muted); }
  .db-res { display: grid; gap: 14px; }
  .db-res-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) 180px; gap: 16px; align-items: center; }
  .db-res-row .lbl { font-weight: 500; }
  .db-res-row .val { text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  .db-res-row .val b { color: var(--text); }
  .db-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
  .db-list { list-style: none; margin: 0; padding: 0; }
  .db-list li { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--border); }
  .db-list li:last-child { border-bottom: 0; }
  .db-list .sub { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .db-group { padding: 8px 16px; background: var(--surface-2); font-size: 12px; color: var(--muted); font-weight: 600; border-bottom: 1px solid var(--border); }
  @media (max-width: 900px) { .db { grid-template-columns: 1fr; } .db-side { position: static; height: auto; } .db-nav { grid-auto-flow: row; } .db-two { grid-template-columns: 1fr; } .db-res-row { grid-template-columns: 90px minmax(0, 1fr); } .db-res-row .val { grid-column: 1 / -1; text-align: left; } }

  /* ---------- Dashboard C: collapsible sidebar + hero band + tabs ---------- */
  .dc { display: grid; grid-template-columns: var(--sw, 220px) minmax(0, 1fr); min-height: 100%; transition: grid-template-columns .18s ease; }
  .dc.collapsed { --sw: 64px; }
  .dc-side { background: var(--rail); color: var(--rail-text); display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; overflow: hidden; }
  .dc-brand { height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; color: #fff; font-weight: 800; white-space: nowrap; }
  .dc-brand .logo { width: 32px; height: 32px; border-radius: 8px; background: var(--accent); display: grid; place-items: center; flex: none; }
  .dc-nav { display: grid; gap: 2px; padding: 8px; }
  .dc-nav a { display: flex; align-items: center; gap: 12px; padding: 9px 13px; border-radius: 6px; color: var(--rail-text); text-decoration: none; white-space: nowrap; }
  .dc-nav a:hover, .dc-nav a.on { background: rgba(255,255,255,.08); color: var(--rail-active); }
  .dc .label { transition: opacity .12s; }
  .dc.collapsed .label { opacity: 0; pointer-events: none; }
  .dc-collapse { margin-top: auto; border: 0; border-top: 1px solid rgba(255,255,255,.08); background: transparent; color: var(--rail-text); display: flex; align-items: center; gap: 12px; padding: 14px 21px; cursor: pointer; white-space: nowrap; }
  .dc-collapse:hover { color: #fff; }
  .dc.collapsed .dc-collapse .icon { transform: rotate(180deg); }
  .dc-top { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--surface); gap: 12px; }
  .dc-top .node { display: flex; gap: 10px; align-items: center; min-width: 0; }
  .dc-top .node b { white-space: nowrap; }
  .dc-band { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); }
  .dc-stat { padding: 16px 18px; border-right: 1px solid var(--border); display: grid; gap: 4px; min-width: 0; }
  .dc-stat:last-child { border-right: 0; }
  .dc-stat .k { font-size: 12px; color: var(--muted); }
  .dc-stat .v { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .dc-stat .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .dc-stat svg { width: 100%; height: 28px; }
  .spark { fill: none; stroke: var(--accent); stroke-width: 1.5; }
  .spark-fill { fill: var(--accent-soft); stroke: none; }
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); padding: 0 8px; overflow-x: auto; }
  .tabs button { white-space: nowrap; }
  .tabs button { border: 0; background: none; padding: 12px 12px 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; font-weight: 500; }
  .tabs button.on { color: var(--text); border-bottom-color: var(--accent); }
  .tabs .count { font-size: 11px; background: var(--surface-2); padding: 0 6px; border-radius: 999px; margin-left: 4px; }
  @media (max-width: 1100px) { .dc-band { grid-template-columns: repeat(3, minmax(0, 1fr)); } .dc-stat:nth-child(3) { border-right: 0; } .dc-stat:nth-child(n+4) { border-top: 1px solid var(--border); } }
  @media (max-width: 640px) { .dc, .dc.collapsed { --sw: 56px; } .dc .label { opacity: 0; } .dc-band { grid-template-columns: repeat(2, minmax(0, 1fr)); } .dc-stat { border-right: 0; border-top: 1px solid var(--border); } .dc-stat:first-child { border-top: 0; } .dc-top { padding: 0 16px; } }

  /* ---------- Prototype switcher (not part of the design) ---------- */
  #proto-bar { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 100; display: flex; align-items: center; gap: 4px;
    background: #111; color: #fff; border-radius: 999px; padding: 5px; box-shadow: 0 8px 24px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.15);
    font: 12px/1 var(--sans); max-width: calc(100vw - 32px); }
  #proto-bar button { border: 0; background: transparent; color: #fff; border-radius: 999px; padding: 8px 10px; cursor: pointer; white-space: nowrap; }
  #proto-bar button:hover { background: #2a2a2a; }
  #proto-bar .seg { display: flex; background: #222; border-radius: 999px; }
  #proto-bar .seg button.on { background: #fff; color: #111; }
  #proto-bar .label { min-width: 150px; text-align: center; font-weight: 600; padding: 0 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #proto-bar .tag { background: #ffd43b; color: #111; border-radius: 999px; padding: 6px 8px; font-weight: 800; letter-spacing: .05em; }
  @media (max-width: 520px) { #proto-bar { flex-wrap: wrap; justify-content: center; border-radius: 18px; } #proto-bar .tag { display: none; } #proto-bar .label { min-width: 0; max-width: 150px; } }
</style>
</head>

<div id="app"></div>
<div id="proto-bar" aria-label="Prototype variant switcher"></div>

function spark(values, max) {
  const w = 120, h = 28, top = max ?? Math.max(...values) * 1.15;
  const pts = values.map((v, i) => [(i / (values.length - 1)) * w, h - (v / top) * h]);
  const line = pts.map(p => p.map(n => n.toFixed(1)).join(",")).join(" ");
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">
    <polygon class="spark-fill" points="0,${h} ${line} ${w},${h}"/><polyline class="spark" points="${line}"/></svg>`;
}

            <div class="tabs" role="tablist">
              ${[["containers", "Containers", containers.length], ["images", "Images", images.length], ["events", "Events"], ["docker", "Docker"]].map(([id, label, n]) =>
                `<button role="tab" data-tab="${id}" class="${state.tab === id ? "on" : ""}">${label}${n ? `<span class="count">${n}</span>` : ""}</button>`).join("")}
            </div>
            ${tabBody[state.tab]()}
          </section>
        </main>
      </div>
    </div>`;
  } },
};

// ---------- Render + switcher ----------
const app = document.getElementById("app");
const barEl = document.getElementById("proto-bar");

function syncUrl() {
  const p = new URLSearchParams({ screen: state.screen, login: state.login, dash: state.dash, theme: state.theme });
  history.replaceState(null, "", "?" + p);
}

function render() {
  document.documentElement.dataset.theme = state.theme;
  const set = state.screen === "login" ? LOGIN : DASH;
  const key = state[state.screen];
  app.innerHTML = set[key].render();
  barEl.innerHTML = `
    <span class="tag">PROTO</span>
    <div class="seg"><button data-screen="login" class="${state.screen === "login" ? "on" : ""}">Login</button><button data-screen="dash" class="${state.screen === "dash" ? "on" : ""}">Dashboard</button></div>
    <button data-step="-1" aria-label="Previous variant">←</button>
    <span class="label">${key} · ${set[key].name}</span>
    <button data-step="1" aria-label="Next variant">→</button>
    <button data-theme-toggle aria-label="Toggle theme">${state.theme === "dark" ? "☀ Light" : "☾ Dark"}</button>`;
  syncUrl();
  console.log("[prototype]", JSON.stringify({ screen: state.screen, login: state.login, dash: state.dash, theme: state.theme, collapsed: state.collapsed, tab: state.tab }));
}

function step(dir) {
  const keys = ["A", "B", "C"];
  const i = keys.indexOf(state[state.screen]);
  state[state.screen] = keys[(i + dir + keys.length) % keys.length];
  render();
}

document.addEventListener("click", e => {
  const t = e.target.closest("button, a");
  if (!t) return;
  if (t.matches("a[href='#']")) e.preventDefault();
  if (t.dataset.screen) { state.screen = t.dataset.screen; state.loginError = null; render(); }
  else if (t.dataset.step) step(Number(t.dataset.step));
  else if ("themeToggle" in t.dataset) { state.theme = state.theme === "dark" ? "light" : "dark"; render(); }
  else if ("logout" in t.dataset) { state.screen = "login"; state.loginError = null; render(); }
  else if ("collapse" in t.dataset) { state.collapsed = !state.collapsed; render(); }
  else if (t.dataset.tab) { state.tab = t.dataset.tab; render(); }
});

document.addEventListener("submit", e => {
  if (!e.target.matches("[data-login]")) return;
  e.preventDefault();
  const f = new FormData(e.target);
  state.username = f.get("username") || "";
  const pw = f.get("password") || "";
  if (!state.username || !pw) state.loginError = "empty";
  else if (pw === "wrong" || pw === "locked") state.loginError = pw;
  else { state.loginError = null; state.screen = "dash"; }
  render();
});

document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

// Mock "live" numbers so layouts are judged with values that move. How the real page
// refreshes (polling vs SSE) is decided in "Node overview contents and refresh" (#13).
setInterval(() => {
  if (state.screen !== "dash") return;
  node.cpu.used = Math.max(4, Math.min(96, node.cpu.used + Math.round((Math.random() - 0.5) * 10)));
  node.cpu.history = [...node.cpu.history.slice(1), node.cpu.used];
  containers.forEach(c => { if (c.state === "running") c.cpu = Math.max(0, c.cpu + (Math.random() - 0.5) * 1.5); });
  render();
}, 5000);

render();
</script>
</body>
</html>
