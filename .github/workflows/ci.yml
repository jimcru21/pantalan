name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check and cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: make check
        run: make check

      - name: Cross-build linux/amd64 and linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -o "bin/pantalan_linux_$arch" ./cmd/pantalan
          done
          file bin/pantalan_linux_*
