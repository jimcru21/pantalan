name: ci

on:
  pull_request:
  push:
    branches: [main]
  # release.yml runs this whole workflow as its gate.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: make check and cross-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/app/.nvmrc
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      # From the lockfile, with install scripts off: no package runs code
      # at install. make check would do this too; doing it first keeps the
      # install's output apart.
      - name: npm ci --ignore-scripts
        working-directory: web/app
        run: npm ci --ignore-scripts

      - name: make check
        run: make check

      - name: Generated API types are up to date
        run: make types-check

      # Into web/dist, so the cross-built binaries embed the SPA.
      - name: Build the Dashboard's frontend
        run: make web

      - name: Cross-build linux/amd64 and linux/arm64
        env:
          CGO_ENABLED: "0"
          GOOS: linux
        run: |
          for arch in amd64 arm64; do
            GOARCH="$arch" go build -trimpath -o "bin/pantalan_linux_$arch" ./cmd/pantalan
          done
          file bin/pantalan_linux_*

  # Playwright against the binary built with its embedded frontend: the
  # only tests where the embedding, the session cookie, the cross-origin
  # check and the CSP work together (web/app/e2e).
  smoke:
    name: smoke tests on the built binary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/app/.nvmrc
          cache: npm
          cache-dependency-path: web/app/package-lock.json

      - name: npm ci --ignore-scripts
        working-directory: web/app
        run: npm ci --ignore-scripts

      # The browser the locked @playwright/test drives, with its system
      # libraries (apt).
      - name: Install Chromium
        working-directory: web/app
        run: npx playwright install --with-deps chromium

      # make build (the frontend, then the binary embedding it), then the
      # suite, which starts bin/pantalan itself.
      - name: Smoke tests
        run: make smoke

      # Traces of the failed tests: open with npx playwright show-trace.
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-test-results
          path: web/app/test-results/
          if-no-files-found: ignore
          retention-days: 7

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # shellcheck ships with the hosted Ubuntu image.
      - name: ShellCheck the installer and release scripts
        run: |
          shellcheck --version
          make shellcheck

  # The installer, end to end, in privileged systemd containers: each distro
  # natively on each arch (see deploy/installtest). No retries: a flake here
  # is a convergence bug until shown otherwise.
  installer:
    name: installer (${{ matrix.distro }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        distro: [debian-12, debian-13, ubuntu-24.04, ubuntu-26.04]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The harness saves the Node images it builds here as tarballs, named
      # by the hash of their Dockerfiles, and loads them on the next run.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/installtest-images
          key: installtest-images-${{ matrix.distro }}-${{ matrix.arch }}-${{ hashFiles('deploy/installtest/images/**') }}

      - name: Installer paths
        env:
          INSTALLTEST_DISTROS: ${{ matrix.distro }}
          INSTALLTEST_IMAGE_CACHE: ${{ runner.temp }}/installtest-images
        run: make installtest

  # One stable name for the branch ruleset to require, whatever the matrix
  # holds.
  installer-matrix:
    name: installer matrix
    if: always()
    needs: installer
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Every installer job passed
        env:
          RESULT: ${{ needs.installer.result }}
        run: test "$RESULT" = success
